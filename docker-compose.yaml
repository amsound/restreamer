# File: docker-compose.yml
services:
  restreamer:
  image: a1exm/restreamer:latest
  container_name: restreamer
  init: true                      # better signal forwarding (like KillMode=control-group)
  environment:
    PORT: "8000"
    STATIONS_FILE: "/data/stations.yaml"
    DEFAULT_FMT: "adts"             # adts (AAC copy), mp3 (320k), flac or wav
    BURST_SECONDS: "4"              # audio sent at once on connect, then real time
    volumes:
      - ./stations.yaml:/data/stations.yaml:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
